name: Help Wanted
description: Task where external contributor help is requested.
title: "[help wanted] "
labels: ["help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest. We try to review quickly and keep tasks actionable.

  - type: input
    id: scope
    attributes:
      label: Scope
      description: Short description of the task.
      placeholder: Improve benchmark reporting summary for readability.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or needs improvement.
    validations:
      required: true

  - type: textarea
    id: done_definition
    attributes:
      label: Definition of done
      description: Explicit outcomes needed before merge.
      value: |
        - [ ] Outcome 1
        - [ ] Outcome 2
        - [ ] Docs updated if needed
    validations:
      required: true

  - type: input
    id: effort
    attributes:
      label: Estimated effort
      description: Approximate contributor effort.
      placeholder: 1-3 hours
